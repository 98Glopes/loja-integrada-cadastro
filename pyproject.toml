[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loja-integrada-cadastro"
version = "0.1.0"
description = "CLI para cadastro de produtos em massa na plataforma Loja Integrada"
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "pillow>=10.4",
    "pillow-heif>=0.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-openpyxl",
    "types-PyYAML",
]

[project.scripts]
loja-integrada-cadastro = "loja_integrada_cadastro.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
loja_integrada_cadastro = ["py.typed", "recursos/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = ["integration: testes que dependem de infraestrutura externa"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "ANN"]
# Exceções de domínio seguem a convenção `Erro<Nome>` (ARQUITETURA.md §10), não o sufixo Error.
ignore = ["N818"]

[tool.mypy]
strict = true
files = ["src"]
